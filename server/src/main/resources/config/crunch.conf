crunch {
  # Non-legacy modes require explicit, positive execution limits; legacy needs none.
  queue-allocation {
    neutral.max-duration = ${?QUEUE_ALLOCATION_NEUTRAL_MAX_DURATION}
    fallback.max-duration = ${?QUEUE_ALLOCATION_FALLBACK_MAX_DURATION}
    cancel-grace = ${?QUEUE_ALLOCATION_CANCEL_GRACE}
    shutdown-grace = ${?QUEUE_ALLOCATION_SHUTDOWN_GRACE}
  }

  deployments {
    sla = ${?DEPLOYMENT_SLA}
  }
  flex-desks = "false"
  flex-desks = ${?FLEX_DESKS}
  stale-prediction-hours = 24
  stale-prediction-hours = ${?STALE_PREDICTION_HOURS}
  manifests {
    refetch-live-api = "false"
    refetch-live-api = ${?REFETCH_LIVE_API}
    lookup-batch-size = 5
    lookup-batch-size = ${?MANIFEST_LOOKUP_BATCH_SIZE}
    max-buffer-size = 500
    max-buffer-size = ${?MANIFEST_MAX_BUFFER_SIZE}
    min-seconds-between-batches = 60
    min-seconds-between-batches = ${?MANIFEST_MIN_SECONDS_BETWEEN_BATCHES}
  }
  forecast {
    max_days = "180"
    max_days = ${?FORECAST_MAX_DAYS}
    poll_minutes = "120"
    poll_minutes = ${?FORECAST_POLL_MINUTES}
  }
  splits {
    raw-data-path = ${?RAW_SPLITS_DATA_PATH}
  }
}
